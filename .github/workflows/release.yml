# Builds installers for every platform into a draft GitHub release.
# Start it by pushing a tag like v0.2.0, or from the Actions tab
# ("Run workflow") with the tag to create. Tags with a "-" (v0.2.0-rc.1)
# become pre-releases, for testing.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create, e.g. v0.2.0 or v0.2.0-rc.1
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  # Portable whisper.cpp builds: don't tune for the CI machine's CPU.
  GGML_NATIVE: 'OFF'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            x86: true
          - os: ubuntu-22.04
            x86: true
          - os: macos-latest
            x86: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Portable x86 CPU baseline (AVX2/FMA/F16C)
        if: matrix.x86
        shell: bash
        run: |
          echo "GGML_AVX=ON" >> "$GITHUB_ENV"
          echo "GGML_AVX2=ON" >> "$GITHUB_ENV"
          echo "GGML_FMA=ON" >> "$GITHUB_ENV"
          echo "GGML_F16C=ON" >> "$GITHUB_ENV"
      - name: Static C runtime on Windows (no VC++ redistributable needed)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev cmake clang
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: StS2 Callout ${{ env.RELEASE_TAG }}
          releaseDraft: true
          # v1.2.3-rc.1 style tags are test builds
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          releaseBody: |
            ## Downloads

            | System | File |
            |---|---|
            | **Windows** (installer) | `StS2.Callout_*_x64-setup.exe` |
            | **Windows** (portable, no install) | `StS2-Callout-windows-portable.zip` |
            | **Linux** (any distro) | `StS2.Callout_*_amd64.AppImage` (`chmod +x`, then run) |
            | **Linux** (Debian/Ubuntu) | `StS2.Callout_*_amd64.deb` |
            | **macOS** 14.6+ (Apple Silicon) | `StS2.Callout_*_aarch64.dmg` |

            The builds aren't code-signed: on Windows click **More info → Run anyway**; on macOS right-click → **Open**.
            The first **Start listening** downloads the speech model (~180 MB). See the [README](https://github.com/${{ github.repository }}#readme) for setup and troubleshooting.
      - name: Attach portable Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force StS2-Callout-windows | Out-Null
          Copy-Item src-tauri/target/release/sts2-callout.exe "StS2-Callout-windows/StS2 Callout.exe"
          Compress-Archive -Path StS2-Callout-windows -DestinationPath StS2-Callout-windows-portable.zip -Force
          gh release upload "$env:RELEASE_TAG" StS2-Callout-windows-portable.zip --clobber --repo ${{ github.repository }}

  # Real releases (no "-" in the tag) are published once every platform built.
  # Test releases stay as drafts for you to check and delete.
  publish:
    needs: build
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/releases" --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id" | head -1)
          test -n "$id" || { echo "no release for $RELEASE_TAG"; exit 1; }
          gh api -X PATCH "repos/${{ github.repository }}/releases/$id" -F draft=false -f make_latest=true --jq '.html_url'

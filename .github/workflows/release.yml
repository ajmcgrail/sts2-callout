# Push a tag like v0.2.0 to build installers for every platform into a draft release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # Portable whisper.cpp builds: don't tune for the CI machine's CPU.
  GGML_NATIVE: 'OFF'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            x86: true
          - os: ubuntu-22.04
            x86: true
          - os: macos-latest
            x86: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Portable x86 CPU baseline (AVX2/FMA/F16C)
        if: matrix.x86
        shell: bash
        run: |
          echo "GGML_AVX=ON" >> "$GITHUB_ENV"
          echo "GGML_AVX2=ON" >> "$GITHUB_ENV"
          echo "GGML_FMA=ON" >> "$GITHUB_ENV"
          echo "GGML_F16C=ON" >> "$GITHUB_ENV"
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev cmake clang
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: StS2 Callout ${{ github.ref_name }}
          releaseBody: See the README for setup. Windows users can use the .msi/.exe installer.
          releaseDraft: true
